services:
  postgres:
    image: postgres:17
    container_name: orderflow-postgres
    environment:
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: orderflow
    ports:
      - "5433:5432"
    volumes:
      - orderflow-data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:4-management
    container_name: orderflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  orderflow-data:
